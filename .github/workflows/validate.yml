name: Validate theory, experiments, and paper

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run theorem and regression tests
        run: pytest

  paper:
    name: Reproduce experiments and build PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --no-build-isolation -e ".[dev]"
      - name: Install LaTeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            poppler-utils \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science
      - name: Reproduce a deterministic smoke sweep
        run: PYTHONPATH=src python -m experiments.run_all --quick
      - name: Build main paper and supplement
        run: make -C paper
      - name: Check page budget, fonts, metadata, and logs
        run: python scripts/check_submission.py
      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: almost-symmetric-submission
          if-no-files-found: error
          path: |
            paper/main.pdf
            paper/supplement.pdf
            experiments/results/summary.json
            experiments/results/reynolds_tightness.csv
            experiments/figures/reynolds_tightness.pdf
