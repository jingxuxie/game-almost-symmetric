name: Validate theory, experiments, and paper

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Prepare packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run theorem and regression tests
        run: pytest

  paper:
    name: Reproduce experiments and build PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Record software and runner environment
        run: |
          mkdir -p experiments/results
          {
            python -VV
            echo
            uname -a
            echo
            lscpu
            echo
            free -h
            echo
            python -m pip freeze
          } > experiments/results/environment.txt
      - name: Install LaTeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            poppler-utils \
            tex-gyre \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-plain-generic \
            texlive-science
      - name: Reproduce the full deterministic experiment sweep
        run: |
          PYTHONPATH=src python -m experiments.run_all \
            --seed 17 \
            --replicates 20 \
            --sampling-replicates 40
      - name: Build paper, supplement, and checklist
        run: make -C paper
      - name: Check page budget, fonts, metadata, and logs
        run: python scripts/check_submission.py
      - name: Upload validation artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almost-symmetric-submission
          if-no-files-found: warn
          path: |
            paper/main.pdf
            paper/supplement.pdf
            paper/reproducibility_checklist.pdf
            paper/*.log
            paper/*.aux
            paper/*.bbl
            experiments/results/environment.txt
            experiments/results/*.csv
            experiments/results/summary.json
            experiments/figures/*.pdf
